name: google_vertex
provider: google
cloud: gcp
# E2A 1.7: the cloud infrastructure (stores, broker, secrets, identity claims) comes from
# e2a-adapters' "gcp" profile; this profile adds the AI services and overrides what it must
extends: gcp
description: >
  Gemini on Vertex AI (google-genai SDK, ADC / Workload Identity) with gemini-embedding,
  Vertex AI Vector Search (hybrid dense + sparse), the Vertex AI Ranking API, Model Armor,
  an ADK agent on Vertex AI Agent Engine as the delegated runtime, MCP servers on Cloud
  Run behind IAP, Firestore for E2A claims and checkpoints, and Cloud Trace / Logging
  through OpenTelemetry. Matches the GCP landing zone order-to-cash-agentic-ai already uses.
features: [tool_use, structured_output, streaming, prompt_caching, reasoning_effort, refusal_fallback,
           embeddings, vector_search, hybrid_search, rerank, guardrails, mcp_gateway,
           managed_agent_runtime, idempotency_store, checkpoint_store, telemetry, infra_as_code,
           release_pipeline]
bindings:
  llm_service: e2a_managed.providers.google_vertex.llm_service:VertexGeminiLLMService
  embedding_model: e2a_managed.providers.google_vertex.llm_service:VertexGeminiEmbeddingModel
  vector_index: e2a_managed.clouds.gcp.services:VertexVectorSearchIndex
  reranker: e2a_managed.clouds.gcp.services:VertexRankingReranker
  guardrail_stage: e2a_managed.clouds.gcp.services:ModelArmorStage
  delegated_runtime: e2a_managed.clouds.gcp.services:VertexAgentEngineRuntime
  mcp_gateway_tool: e2a_managed.clouds.gcp.services:IAPGatewayTool
  observability_engine: e2a_managed.clouds.gcp.services:GCPObservability
  infra_provisioner: e2a_managed.clouds.gcp.services:GCPManagedInfraProvisioner
  release_pipeline: e2a_managed.clouds.gcp.services:GCPReleasePipeline
config:
  model_id: ${LLM_MODEL_ID:-gemini-2.5-pro}
  fallback_model_id: ${LLM_FALLBACK_MODEL_ID}
  reasoning_effort: ${LLM_REASONING_EFFORT:-medium}
  temperature: ${LLM_TEMPERATURE:-0.0}
  gcp_location: ${GOOGLE_CLOUD_LOCATION:-us-central1}
  llm_max_latency: ${LLM_MAX_LATENCY:-60}
  context_budget: ${LLM_CONTEXT_BUDGET:-150000}
  max_output_tokens: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  embedding_model_id: ${EMBEDDING_MODEL_ID:-gemini-embedding-001}
  embedding_dimensions: ${EMBEDDING_DIMENSIONS:-768}
  vector_index_name: ${VECTOR_INDEX_NAME:-e2a-knowledge}
  vertex_index: ${VERTEX_INDEX}
  vertex_index_endpoint: ${VERTEX_INDEX_ENDPOINT}
  vertex_deployed_index_id: ${VERTEX_DEPLOYED_INDEX_ID}
  vertex_ranking_config: ${VERTEX_RANKING_CONFIG:-default_ranking_config}
  model_armor_template: ${MODEL_ARMOR_TEMPLATE}
  vertex_agent_engine: ${VERTEX_AGENT_ENGINE}
  mcp_server_url: ${MCP_GATEWAY_URL}
  otel_service_name: ${OTEL_SERVICE_NAME:-e2a-service}
