name: anthropic_claude_platform_aws
provider: anthropic
cloud: aws
description: >
  Claude Platform on AWS (Anthropic-operated, AWS IAM/SigV4 and AWS billing, same-day API
  parity): adds the Anthropic MCP connector, server-side refusal fallbacks and Claude
  Managed Agents as the delegated runtime. Retrieval, guardrails and state still use the
  AWS platform services, exactly as in anthropic_bedrock.
features: [tool_use, structured_output, streaming, prompt_caching, reasoning_effort, refusal_fallback,
           mcp_connector, embeddings, vector_search, rerank, guardrails, prompt_registry,
           managed_agent_runtime, idempotency_store, checkpoint_store, telemetry, infra_as_code,
           release_pipeline]
bindings:
  llm_service: e2a_managed.providers.anthropic_aws.llm_service:ClaudePlatformAWSLLMService
  delegated_runtime: e2a_managed.providers.anthropic_aws.delegated_runtime:ClaudeManagedAgentsRuntime
  embedding_model: e2a_managed.clouds.aws.bedrock:TitanEmbeddingModel
  vector_index: e2a_managed.clouds.aws.bedrock:S3VectorsIndex
  reranker: e2a_managed.clouds.aws.bedrock:BedrockReranker
  guardrail_stage: e2a_managed.clouds.aws.bedrock:BedrockGuardrailStage
  prompt_registry: e2a_managed.clouds.aws.bedrock:BedrockPromptRegistry
  observability_engine: e2a_managed.clouds.aws.substrate:AWSObservability
  idempotency_store: e2a_managed.clouds.aws.substrate:DynamoDBIdempotencyStore
  checkpoint_store: e2a_managed.clouds.aws.substrate:DynamoDBCheckpointStore
  infra_provisioner: e2a_managed.clouds.aws.substrate:AWSInfraProvisioner
  release_pipeline: e2a_managed.clouds.aws.substrate:AWSReleasePipeline
config:
  model_id: ${LLM_MODEL_ID:-claude-opus-5-5}          # bare first-party ids on this platform
  reasoning_effort: ${LLM_REASONING_EFFORT:-medium}
  aws_region: ${AWS_REGION:-us-east-1}
  anthropic_aws_workspace_id: ${ANTHROPIC_AWS_WORKSPACE_ID}
  # Remote MCP servers Claude may call through the MCP connector (read tools only), e.g.
  # MCP_SERVERS='[{"name":"o2c-tools","url":"https://o2c.example.com/mcp","token_env":"O2C_MCP_TOKEN"}]'
  mcp_servers: ${MCP_SERVERS:-[]}
  llm_max_latency: ${LLM_MAX_LATENCY:-60}
  context_budget: ${LLM_CONTEXT_BUDGET:-150000}
  max_output_tokens: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  embedding_model_id: ${EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
  embedding_dimensions: ${EMBEDDING_DIMENSIONS:-1024}
  rerank_model_id: ${RERANK_MODEL_ID:-cohere.rerank-v3-5:0}
  vector_index_name: ${VECTOR_INDEX_NAME:-e2a-knowledge}
  s3_vector_bucket: ${S3_VECTOR_BUCKET}
  bedrock_guardrail_id: ${BEDROCK_GUARDRAIL_ID}
  bedrock_guardrail_version: ${BEDROCK_GUARDRAIL_VERSION:-DRAFT}
  bedrock_prompt_arn_prefix: ${BEDROCK_PROMPT_ARN_PREFIX}
  delegated_runtime_id: ${DELEGATED_RUNTIME_ID}
  delegated_runtime_environment: ${DELEGATED_RUNTIME_ENVIRONMENT}
  dynamodb_idempotency_table: ${DYNAMODB_IDEMPOTENCY_TABLE:-e2a-idempotency}
  dynamodb_checkpoint_table: ${DYNAMODB_CHECKPOINT_TABLE:-e2a-checkpoints}
  otel_service_name: ${OTEL_SERVICE_NAME:-e2a-service}
