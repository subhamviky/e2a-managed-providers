# Everything here runs without any cloud or model-provider account.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions -> ci -> Run workflow): the project suites check out the projects'
  # current main, so this re-checks them after a project changes, without a commit here.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"      # the extras alone: nothing installed by name here
      - name: Start DynamoDB Local and the Firestore and Cosmos DB emulators (the profile-bound stores' contract, races included)
        run: |
          docker run -d --name ddb -p 8000:8000 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -inMemory -port 8000
          docker run -d --name firestore -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
          docker run -d --name cosmos -p 8081:8081 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          for port in 8000 8085 8081; do
            for _ in $(seq 90); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 2; done
          done
          for _ in $(seq 60); do docker logs cosmos 2>&1 | grep -q "Gateway=OK" && break; sleep 2; done
      - name: Unit, contract and offline wire-replay tests (all providers, real SDKs; stores on the emulators)
        env:
          DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:8000
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          COSMOS_EMULATOR_ENDPOINT: http://127.0.0.1:8081
        run: pytest -q -rs
      - name: Every profile binds and provides its features
        run: for p in $(python -m e2a_managed profiles | awk '{print $1}'); do python -m e2a_managed verify "$p"; done

  project-suites:
    # The three projects' OWN test suites, with their model binding swapped to each profile.
    needs: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [anthropic_bedrock, anthropic_claude_platform_aws, openai_azure, google_vertex, ogx_aws]
    steps:
      - uses: actions/checkout@v4
        with:
          path: e2a-managed-providers
      - uses: actions/checkout@v4
        with:
          repository: subhamviky/order-to-cash-agentic-ai
          path: order-to-cash-agentic-ai
      - uses: actions/checkout@v4
        with:
          repository: subhamviky/aws-reconciliation-engine
          path: aws-reconciliation-engine
      - uses: actions/checkout@v4
        with:
          repository: subhamviky/financial-settlement-platform
          path: financial-settlement-platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tooling for the runner (profiles CLI)
        run: pip install -e e2a-managed-providers
      - name: Start the Firestore and Cosmos DB emulators (the projects' shared-state tests)
        run: |
          docker run -d --name firestore -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
          docker run -d --name cosmos -p 8081:8081 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          for _ in $(seq 90); do curl -s -o /dev/null http://127.0.0.1:8085/ && break; sleep 2; done
          for _ in $(seq 90); do docker logs cosmos 2>&1 | grep -q "Gateway=OK" && break; sleep 2; done
      - name: Project test suites on ${{ matrix.profile }} (offline replay, one venv per project)
        working-directory: e2a-managed-providers
        # The projects pin different E2A releases, so each runs in its own venv built from
        # its own pyproject; this package is added there without its dependencies. O2C and
        # audit-ai run a second time with their state on the emulators.
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          COSMOS_EMULATOR_ENDPOINT: http://127.0.0.1:8081
          EVIDENCE_FILE: ${{ runner.temp }}/evidence.md
        run: |
          ISOLATED=1 PROJECTS_DIR=.. ./examples/run_project_suites.sh ${{ matrix.profile }}
          cat "$EVIDENCE_FILE" >> "$GITHUB_STEP_SUMMARY"
      - name: Landscape scenario on ${{ matrix.profile }}
        working-directory: e2a-managed-providers
        run: |
          .venvs/o2c-agent-service/bin/pip install -q -e ../financial-settlement-platform/audit-ai-service --no-deps
          .venvs/o2c-agent-service/bin/python examples/run_landscape.py ${{ matrix.profile }}

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - e2a_managed/clouds/aws/terraform
          - e2a_managed/clouds/azure/terraform
          - e2a_managed/clouds/gcp/terraform
          - e2a_managed/providers/ogx/terraform
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: terraform test (mock providers, no account)
        run: terraform test

  terraform-extensions:
    # Recent resource types (S3 Vectors, AgentCore Gateway, Model Armor): validated, not blocking.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module:
          - e2a_managed/clouds/aws/terraform/extensions/s3_vectors
          - e2a_managed/clouds/aws/terraform/extensions/agentcore_gateway
          - e2a_managed/clouds/gcp/terraform/extensions/model_armor
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -backend=false && terraform validate
        working-directory: ${{ matrix.module }}

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: subhamviky/e2a-framework
          ref: v1.3.0
          path: e2a-framework
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests install -f e2a-framework/java/pom.xml -pl e2a-core -am
      - name: Java LlmService adapters against local wire replay (real provider SDKs)
        run: mvn -B verify -f java/pom.xml

  managed-agents-definitions:
    # Claude Managed Agents are IaC too (ant apply). Without an account: syntax only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import pathlib, yaml
          for f in pathlib.Path("e2a_managed/providers/anthropic_aws/managed_agents").rglob("*"):
              if f.suffix in (".yaml", ".yml"):
                  yaml.safe_load(f.read_text())
              elif f.name == "agent.md":
                  front = f.read_text().split("---")[1]
                  agent = yaml.safe_load(front)
                  assert agent["model"] and agent["tools"], f
                  assert all(t.get("type") != "agent_toolset_20260401" or not t["default_config"].get("enabled", True)
                             for t in agent["tools"]), "built-in sandbox tools must stay off"
              print("ok", f)
          PY
